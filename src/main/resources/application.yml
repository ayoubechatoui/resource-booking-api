spring:
  application:
    name: resource-booking-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  admin:
    email: ${ADMIN_EMAIL:admin@booking.local}
    password: ${ADMIN_PASSWORD}

server:
  error:
    include-message: always