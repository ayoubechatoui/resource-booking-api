name: Publier l'image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Calculer les tags
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA_COURT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Se connecter à ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire l'image
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}
          -t "$IMAGE:$VERSION"
          -t "$IMAGE:$SHA_COURT"
          .

      - name: Publier l'image
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHA_COURT"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SHA_COURT")
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Installer cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 

      - name: Signer l'image
        run: cosign sign --yes "$DIGEST"

      - name: Vérifier la signature
        run: >
          cosign verify "$DIGEST"
          --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@.*"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com